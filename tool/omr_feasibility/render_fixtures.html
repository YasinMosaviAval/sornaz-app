<!doctype html><meta charset="utf-8"><body style="margin:0;background:#fff"><div id="score"></div>
<script src="../../assets/notation/vendor/vexflow.js"></script>
<script>
// Fixture ground truth is authored below, independently of the OMR probe.
const VF=Vex.Flow, id=new URL(location.href).searchParams.get('case')||'treble';
const cases={
 treble:{clefs:['treble'],bars:[[[{k:'g/4',d:'q'},{k:'a/4',d:'h'},{k:'b/4',d:'q'}]],[[{k:'c/5',d:'q'},{k:'d/5',d:'q'},{k:'e/5',d:'h'}]]]},
 bass:{clefs:['bass'],bars:[[[{k:'g/2',d:'q'},{k:'b/2',d:'q'},{k:'d/3',d:'h'}]],[[{k:'e/3',d:'q'},{k:'f/3',d:'q'},{k:'g/3',d:'h'}]]]},
 rhythm:{clefs:['treble'],bars:[[[{k:'c/5',d:'8'},{k:'d/5',d:'8'},{k:'b/4',d:'qr'},{k:'e/5',d:'q',dots:1},{k:'f/5',d:'8'}]]]},
 accidentals:{clefs:['treble'],bars:[[[{k:'f#/4',d:'q',acc:'#'},{k:'b@/4',d:'q',acc:'b'},{k:'f/4',d:'q',acc:'n'},{k:'g/4',d:'q'}]]]},
 piano:{clefs:['treble','bass'],bars:[[[{k:'c/5',d:'q'},{k:'d/5',d:'q'},{k:'e/5',d:'q'},{k:'f/5',d:'q'}],[{k:'c/3',d:'h'},{k:'g/2',d:'h'}]],[[{k:'g/5',d:'h'},{k:'e/5',d:'h'}],[{k:'c/3',d:'q'},{k:'d/3',d:'q'},{k:'e/3',d:'q'},{k:'f/3',d:'q'}]]]},
 chords:{clefs:['treble','bass'],bars:[[[{k:['c/5','e/5','g/5'],d:'h'},{k:['d/5','f/5','a/5'],d:'h'}],[{k:['c/3','e/3','g/3'],d:'h'},{k:['g/2','b/2','d/3'],d:'h'}]]]},
 multi:{clefs:['treble'],multiSystem:true,bars:[[[{k:'c/5',d:'q'},{k:'d/5',d:'q'},{k:'e/5',d:'q'},{k:'f/5',d:'q'}]],[[{k:'g/5',d:'q'},{k:'f/5',d:'q'},{k:'e/5',d:'q'},{k:'d/5',d:'q'}]]]},
 invalid:{clefs:[],bars:[]},
};
const spec=cases[id];
if(!spec){document.body.textContent='UNKNOWN';throw Error('Unknown case');}
const width=1200,height=spec.multiSystem?360:spec.clefs.length===2?330:170;
const renderer=new VF.Renderer(document.getElementById('score'),VF.Renderer.Backends.SVG);renderer.resize(width,height);
const ctx=renderer.getContext(),barWidth=spec.bars.length===1?700:480;
spec.bars.forEach((bar,bi)=>{
 const staves=spec.clefs.map((clef,si)=>{
  const s=new VF.Stave(spec.multiSystem?25:25+bi*barWidth,10+(spec.multiSystem?bi*150:0)+si*150,barWidth);
  if(bi===0||spec.multiSystem)s.addClef(clef).addTimeSignature('4/4');
  s.setContext(ctx).draw();return s;
 });
 if(staves.length===2){
  for(const type of [VF.StaveConnector.type.SINGLE_LEFT,VF.StaveConnector.type.BRACE,VF.StaveConnector.type.SINGLE_RIGHT])
    new VF.StaveConnector(staves[0],staves[1]).setType(type).setContext(ctx).draw();
 }
 bar.forEach((events,si)=>{
  const notes=events.map(e=>{
   const keys=(Array.isArray(e.k)?e.k:[e.k]).map(k=>k.replace('#','').replace('@',''));
   const note=new VF.StaveNote({clef:spec.clefs[si],keys,duration:e.d,dots:e.dots||0});
   if(e.acc)note.addModifier(new VF.Accidental(e.acc),0);
   if(e.dots){VF.Dot.buildAndAttach([note],{all:true});}
   return note;
  });
  const voice=new VF.Voice({num_beats:4,beat_value:4});voice.addTickables(notes);
  new VF.Formatter().joinVoices([voice]).format([voice],barWidth-(bi===0?130:70));
  voice.draw(ctx,staves[si]);
 });
});
document.body.dataset.ready='yes';
</script>
