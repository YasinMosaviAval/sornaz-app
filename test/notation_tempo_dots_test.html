<!doctype html><html><meta charset="utf-8"><link rel="stylesheet" href="../assets/notation/notation.css"><link rel="stylesheet" href="../assets/notation/ui_controls.css"><body data-result="pending"><main id="app"></main><div id="toast"></div>
<script>
window.NOTATION_BOOT={locale:new URL(location.href).searchParams.get('locale')||'fa',userId:1,embedded:true,nativeToolbar:true,durationMode:2};
window.SornazNotation={postMessage(raw){const d=JSON.parse(raw);if(!d.id)return;let value=true;if(d.action==='list')value={items:[],has_more:false};if(d.action==='instruments')value=[{id:'Tar',en:'Tar',fa:'تار'}];if(d.action==='export')window.exported=JSON.parse(d.content);queueMicrotask(()=>Notation.receive(d.id,value,null));}};
</script>
<script src="../assets/notation/vendor/vexflow.js"></script><script src="../assets/notation/piano_style.js"></script><script src="../assets/notation/model.js"></script><script src="../assets/notation/ui_symbols.js"></script><script src="../assets/notation/ui_glyphs.js"></script><script src="../assets/notation/score_renderer.js"></script><script src="../assets/notation/importer.js"></script><script src="../assets/notation/ui_controls.js"></script><script src="../assets/notation/notation.js"></script>
<script>
(async()=>{const pause=()=>new Promise(r=>setTimeout(r,45)),find=s=>document.querySelector(s),expect=(v,m)=>{if(!v)throw Error(m);},click=s=>{const e=find(s);expect(e,'Missing '+s+'; '+find('#toast').textContent);e.click();};try{
 await pause();const s=NotationModel.fresh();s.metadata.title='Tempo dots';s.score.measures[0].notes=[{pitch:'C4',duration:'q',rest:false}];const initial=Notation.importContent(JSON.stringify({format:'sornaz-notation',version:1,metadata:s.metadata,score:s.score}),'tempo.json');await pause();click('[data-action=confirm-import]');await initial;
 for(const dots of [1,2]){
  Notation.command('metadata');await pause();click('.beat-picker summary');click('[data-action=beat-unit][data-value="q:'+dots+'"]');find('#metadata').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await pause();
  expect(find('.metronome-mark .tempo-dots').textContent==='·'.repeat(dots),'Editor tempo mark omitted dots');Notation.command('export');await pause();expect(exported.metadata.tempo_dots===dots&&exported.metadata.tempo_note==='q','Tempo dots were not saved');
  const event=NotationModel.timeline({metadata:exported.metadata,score:exported.score}).events[0];expect(Math.abs(event.length-60/100*16/NotationModel.ticks({duration:'q',dots}))<1e-9,'Dotted tempo playback mismatch');
  const reopened=Notation.importContent(JSON.stringify(exported),'reopened.json');await pause();if(find('[data-action=yes]')){click('[data-action=yes]');await pause();}click('[data-action=confirm-import]');await reopened;expect(find('.tempo-dots').textContent==='·'.repeat(dots),'Reopening lost the tempo dots');
  Notation.command('metadata');await pause();expect(find('[name=tempo_unit]').value==='q:'+dots,'Form did not retain dotted beat unit');await Notation.back();await pause();
 }
 document.body.dataset.result='PASS';
}catch(e){document.body.dataset.result='FAIL '+e.message;}})();
</script></body></html>
