<!doctype html><html><meta charset="utf-8"><link rel="stylesheet" href="../assets/notation/notation.css"><link rel="stylesheet" href="../assets/notation/ui_controls.css"><body data-result="pending"><main id="app"></main><div id="toast"></div>
<script>
window.NOTATION_BOOT={locale:new URL(location.href).searchParams.get('locale')||'fa',userId:1,embedded:true,nativeToolbar:true,durationMode:2};
window.SornazNotation={postMessage(raw){const d=JSON.parse(raw);if(!d.id)return;let value=true;if(d.action==='list')value={items:[],has_more:false};if(d.action==='instruments')value=[{id:'Tar',en:'Tar',fa:'تار'}];if(d.action==='export')window.exported=JSON.parse(d.content);queueMicrotask(()=>Notation.receive(d.id,value,null));}};
</script>
<script src="../assets/notation/vendor/vexflow.js"></script><script src="../assets/notation/piano_style.js"></script><script src="../assets/notation/model.js"></script><script src="../assets/notation/ui_symbols.js"></script><script src="../assets/notation/ui_glyphs.js"></script><script src="../assets/notation/score_renderer.js"></script><script src="../assets/notation/importer.js"></script><script src="../assets/notation/ui_controls.js"></script><script src="../assets/notation/notation.js"></script>
<script>
(async()=>{const pause=()=>new Promise(r=>setTimeout(r,60)),find=s=>document.querySelector(s),expect=(v,m)=>{if(!v)throw Error(m);},click=s=>{const e=find(s);expect(e,'Missing '+s);e.dispatchEvent(new MouseEvent('click',{bubbles:true}));};try{
 await pause();const M=NotationModel,s=M.fresh(),symbols=['k','o','bk','#o'],deltas=[-.5,.5,-1.5,1.5];s.metadata.title='Iranian notation';s.metadata.scale_type='iran_shur';
 s.score.measures[0].notes=symbols.map((accidental,i)=>({pitch:'C4',duration:'q',dots:0,staff:1,voice:1,at:i*M.wholeUnits/4,accidental}));
 const task=Notation.importContent(JSON.stringify({format:'sornaz-notation',version:1,metadata:s.metadata,score:s.score}),'iranian.json');await pause();click('[data-action=confirm-import]');await task;await pause();
 expect(!find('[data-action=import-score]'),'Import button remains in editor');
 click('[data-tool-sheet=palette]');const accidentalOptions=[...find('[data-choice=accidental]').options];expect(symbols.every(value=>accidentalOptions.some(o=>o.value===value)),'Iranian accidental missing from user choices');
 const expectedFa=['دستگاه شور','دستگاه ماهور','دستگاه همایون','دستگاه نوا','دستگاه سه گاه','دستگاه چهارگاه','دستگاه راست پنجگاه','آواز ابوعطا','آواز بیات ترک','آواز افشاری','آواز دشتی','آواز بیات اصفهان'];expect(M.iranianScales.every((row,i)=>row[1]===expectedFa[i]),'Persian mode labels changed');
 const probe=document.createElement('div');probe.style.width='390px';document.body.append(probe);NotationRenderer.draw(probe,s,{accent:'#0065ff'});const marked=probe.querySelectorAll('svg path').length;const natural=M.clone(s);natural.score.measures[0].notes.forEach(n=>n.accidental='');NotationRenderer.draw(probe,natural,{accent:'#0065ff'});expect(marked-probe.querySelectorAll('svg path').length>=6,'Iranian or combined accidentals did not engrave');probe.remove();
 for(let i=0;i<4;i++){expect(Math.abs(M.frequency('C4',symbols[i])/M.frequency('C4')-2**(deltas[i]/12))<1e-10,'Pitch offset '+symbols[i]);expect(NotationGlyphs.option('accidental',symbols[i],symbols[i]).includes('<path'),'Missing music glyph '+symbols[i]);}
 const events=M.timeline(s).events;expect(events.length===4&&events.every((e,i)=>Math.abs(e.hz-M.frequency('C4',symbols[i]))<1e-6),'Playback pitch mismatch');
 const xml=Notation.musicXml(s);expect(xml.includes('<alter>-1.5</alter>')&&xml.includes('<alter>1.5</alter>'),'MusicXML lost microtonal pitch');const restored=NotationImporter.parse(xml,'iranian.musicxml').sheet;expect(restored.score.measures[0].notes.every((n,i)=>n.accidental===symbols[i]),'MusicXML microtonal round trip');
 Notation.command('metadata');await pause();const select=find('[name=scale_type]'),modeOptions=[...select.options].filter(o=>o.value.startsWith('iran_'));expect(modeOptions.length===12&&modeOptions.every((o,i)=>o.value===M.iranianScales[i][0]),'Iranian mode order');
 expect(!find('[name=key]').disabled&&find('[name=key]').options.length===25,'Iranian tonic choices are unavailable');click('[data-control-key=scale_type].notation-symbol-picker');await pause();const option=find('[data-notation-option=iran_bayat_esfahan]');expect(parseFloat(getComputedStyle(option).fontSize)===12,'Option text is not 12');expect(parseFloat(getComputedStyle(option.querySelector('.notation-option-check')).fontSize)===12,'Checkbox icon is not 12');expect(option.querySelector('.notation-option-check').textContent==='☐','Checkbox icon is missing');click('[data-notation-option=iran_bayat_esfahan]');await pause();click('[data-control-key=key].notation-symbol-picker');await pause();click('[data-notation-option="G:o"]');await pause();
 find('#metadata').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await pause();Notation.command('export');await pause();expect(exported.metadata.scale_type==='iran_bayat_esfahan'&&exported.metadata.key==='G:o','Iranian mode metadata not retained');
 const tonicRoundTrip=NotationImporter.parse(Notation.musicXml(exported),'quarter-tonic.musicxml').sheet;expect(tonicRoundTrip.metadata.key==='G:o'&&tonicRoundTrip.metadata.scale_type==='iran_bayat_esfahan','MusicXML lost the mode or quarter-tone tonic');
 const changed=M.fresh();Object.assign(changed.metadata,{title:'Key changes',scale_type:'iran_shur',key:'G'});changed.score.measures=[{notes:[{pitch:'A4',duration:'q',rest:false}]},{key:'A:k',notes:[{pitch:'C5',duration:'q',rest:false}]}];const changedRoundTrip=NotationImporter.parse(Notation.musicXml(changed),'key-change.musicxml').sheet;expect(changedRoundTrip.score.measures[1].key==='A:k'&&Math.abs(M.timeline(changedRoundTrip).events[0].hz-M.frequency('A4','k'))<1e-8,'Iranian key change or implicit pitch was lost');
 Notation.command('metadata');await pause();Notation.configure({fontScale:1.25});await pause();click('[data-control-key=scale_type].notation-symbol-picker');await pause();const scaled=find('[data-notation-option=iran_shur]');expect(parseFloat(getComputedStyle(scaled).fontSize)===15&&parseFloat(getComputedStyle(scaled.querySelector('.notation-option-check')).fontSize)===15,'Compact choices ignored global font scale');
 document.body.dataset.result='PASS';
}catch(e){document.body.dataset.result='FAIL '+e.message;}})();
</script></body></html>
