<!doctype html><html><meta charset="utf-8"><link rel="stylesheet" href="../assets/notation/notation.css"><link rel="stylesheet" href="../assets/notation/ui_controls.css"><body data-result="pending"><main id="app"></main><div id="toast"></div>
<script>
window.NOTATION_BOOT={locale:new URL(location.href).searchParams.get('locale')||'fa',userId:1,embedded:true,nativeToolbar:true,durationMode:2};
window.SornazNotation={postMessage(raw){const d=JSON.parse(raw);if(!d.id)return;let value=true;if(d.action==='list')value={items:[],has_more:false};if(d.action==='instruments')value=[{id:'Tar',en:'Tar',fa:'تار'},{id:'Violin',en:'Violin',fa:'ویولن'}];if(d.action==='export')window.exported=JSON.parse(d.content);queueMicrotask(()=>Notation.receive(d.id,value,null));}};
</script>
<script src="../assets/notation/vendor/vexflow.js"></script><script src="../assets/notation/piano_style.js"></script><script src="../assets/notation/model.js"></script><script src="../assets/notation/ui_symbols.js"></script><script src="../assets/notation/ui_glyphs.js"></script><script src="../assets/notation/score_renderer.js"></script><script src="../assets/notation/importer.js"></script><script src="../assets/notation/ui_controls.js"></script><script src="../assets/notation/notation.js"></script>
<script>
(async()=>{const pause=()=>new Promise(r=>setTimeout(r,45)),find=s=>document.querySelector(s),expect=(v,m)=>{if(!v)throw Error(m);},click=s=>{const e=find(s);expect(e,'Missing '+s);e.click();},box=n=>n.getBoundingClientRect();try{
 await pause();const s=NotationModel.fresh();s.metadata.title='Compact fields';s.score.measures[0].notes=[{pitch:'C4',duration:'q',rest:false}];const task=Notation.importContent(JSON.stringify({format:'sornaz-notation',version:1,metadata:s.metadata,score:s.score}),'compact.json');await pause();click('[data-action=confirm-import]');await task;Notation.command('metadata');await pause();
 expect(Math.abs(box(find('[data-control-key=instrument].notation-symbol-picker')).height-box(find('[name=lyricist]')).height)<1,'Instrument height differs from its row');
 expect(Math.abs(box(find('[data-control-key=tempo_text].notation-symbol-picker')).height-box(find('[name=bpm]')).height)<1,'Tempo name height differs from its row');
 for(const name of ['instrument','scale_type','key','clef','time','tempo_text']){
  click('[data-control-key='+name+'].notation-symbol-picker');await pause();const menu=find('.notation-symbol-popup'),options=[...menu.querySelectorAll('.notation-symbol-option')];expect(options.length,'Empty choices '+name);
  const largest=Math.max(...options.map(o=>box(o.lastElementChild).width));expect(box(menu).width<=Math.min(innerWidth-16,largest+60)+1,'Unused menu width '+name);
  for(const option of options){expect(option.firstElementChild.classList.contains('notation-option-check'),'Checkbox must precede item text');const check=box(option.firstElementChild),text=box(option.lastElementChild),gap=menu.dir==='rtl'?check.left-text.right:text.left-check.right;expect(gap>=-1&&gap<=8,'Check is separated from its text '+name);}
  NotationControls.close();
 }
 const presets=[...find('[name=time]').options].map(o=>o.value).filter(v=>v!=='manual');
 click('[data-control-key=time].notation-symbol-picker');click('[data-notation-option=manual]');await pause();expect(find('[name=time_top]').options.length===32&&find('[name=time_bottom]').options.length===9,'Manual time bounds');
 click('[data-control-key=time_top].notation-symbol-picker');click('[data-notation-option="19"]');await pause();click('[data-control-key=time_bottom].notation-symbol-picker');click('[data-notation-option="32"]');await pause();
 find('#metadata').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await pause();Notation.command('export');await pause();expect(exported.metadata.time==='19/32'&&!('time_top' in exported.metadata),'Manual time was not serialized');
 Notation.command('metadata');await pause();expect(find('[name=time]').value==='manual'&&find('[name=time_top]').value==='19'&&find('[name=time_bottom]').value==='32','Manual time was not restored');
 click('[data-control-key=time].notation-symbol-picker');click('[data-notation-option="3/4"]');await pause();expect(!find('[name=time_top]'),'Manual fields remain after standard time');find('#metadata').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await pause();
 click('[data-tool-sheet=measure]');await pause();
 const measurePresets=[...find('[data-measure-choice=time]').options].map(o=>o.value).filter(v=>v&&v!=='manual');expect(JSON.stringify(presets)===JSON.stringify(measurePresets),'Metadata and measure presets differ');expect(find('[data-measure-choice=timeSymbol]').disabled,'C symbols enabled for 3/4');
 const chooseMeasure=async(key,value)=>{click('[data-control-key='+key+'].notation-symbol-picker');click('[data-notation-option="'+value+'"]');await pause();};
 await chooseMeasure('time','4/4');expect(!find('[data-measure-choice=timeSymbol]').disabled,'Common time disabled for 4/4');await chooseMeasure('timeSymbol','common');
 await chooseMeasure('time','manual');expect(find('[data-measure-choice=timeTop]')&&find('[data-measure-choice=timeBottom]'),'Missing measure manual fields');await chooseMeasure('timeTop','19');await chooseMeasure('timeBottom','32');expect(find('[data-measure-choice=timeSymbol]').disabled,'C symbol enabled for manual 19/32');Notation.command('export');await pause();expect(exported.score.measures[0].time==='19/32'&&!exported.score.measures[0].timeSymbol,'Measure manual time or stale C symbol');
 await chooseMeasure('time','');expect(!find('[data-measure-choice=timeTop]')&&find('[data-measure-choice=timeSymbol]').disabled,'Inherited 3/4 should disable C symbols');await chooseMeasure('time','2/2');expect(!find('[data-measure-choice=timeSymbol]').disabled,'Cut time disabled for 2/2');await chooseMeasure('timeSymbol','cut');
 click('[data-action=add-bar]');await pause();expect(!find('[data-measure-choice=timeSymbol]').disabled,'Inherited 2/2 should enable C symbols');await chooseMeasure('time','7/8');expect(find('[data-measure-choice=timeSymbol]').disabled,'7/8 should disable C symbols');
 const trigger=find('[data-control-key=barline].notation-symbol-picker'),before=box(trigger.querySelector('svg')).width;trigger.click();await pause();const glyph=find('.notation-measure-options .notation-control-glyph');expect(box(glyph).width===36&&box(glyph).height===36,'Measure menu contents are not triple size');expect(box(trigger.querySelector('svg')).width===before,'Measure trigger icon size changed');
 document.body.dataset.result='PASS';
}catch(e){document.body.dataset.result='FAIL '+e.message;}})();
</script></body></html>
