<!doctype html>
<html lang="en">
<meta charset="utf-8">
<body data-result="pending">
<main id="app"></main><div id="toast"></div>
<script>
window.onerror = (_, __, ___, ____, error) => document.body.dataset.result = 'failed: ' + (error?.message || _);
const piano = {id:'piano',en:'Piano',fa:'پیانو',staves:[{clef:'treble'},{clef:'bass'}]};
const guitar = {id:'guitar',en:'Guitar',fa:'گیتار'};
window.fetch = async url => ({ok:true,json:async()=>({success:true,data:
  String(url).endsWith('/instruments')?[piano,guitar]:{items:[],has_more:false}})});
window.NOTATION_BOOT = {locale:'en',embedded:false,api:'/music-sheets/api',userId:1};
</script>
<script src="../assets/notation/vendor/vexflow.js"></script>
<script src="../assets/notation/model.js"></script>
<script src="../assets/notation/ui_symbols.js"></script>
<script src="../assets/notation/score_renderer.js"></script>
<script src="../assets/notation/notation.js"></script>
<script>
const pause = () => new Promise(resolve => setTimeout(resolve, 40));
const click = selector => {const item=document.querySelector(selector);if(!item)throw Error('Missing '+selector);item.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));};
setTimeout(async()=>{
 try {
  click('[data-action="new"]');await pause();
  const form=document.getElementById('metadata');if(!form)throw Error('New score form did not open');
  form.elements.title.value='Grand staff test';
  form.elements.instrument.value='piano';form.elements.instrument.dispatchEvent(new Event('change',{bubbles:true}));
  const pianoForm=document.getElementById('metadata');
  pianoForm.elements.scale_type.value='major';pianoForm.elements.scale_type.dispatchEvent(new Event('change',{bubbles:true}));
  const ready=document.getElementById('metadata');ready.elements.key.value='C';ready.elements.tempo_unit.value='q:0';ready.elements.bpm.value='100';
  ready.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await pause();
  if(document.querySelectorAll('.staff-picker button').length!==2)throw Error('Piano staff selector is missing');
  click('[data-staff="1"][data-bar="0"]');click('[data-pitch="C4"]');await pause();
  click('.staff-picker [data-staff="2"]');click('[data-pitch="C3"]');await pause();
  const hits=[...document.querySelectorAll('#score [data-note]')];
  if(hits.length!==2||!hits.some(hit=>hit.dataset.staff==='1')||!hits.some(hit=>hit.dataset.staff==='2'))
   throw Error('Keyboard notes were not added to both staves');
  click('#score [data-note][data-staff="2"]');click('[data-action="duration"][data-value="h"]');await pause();
  if(document.querySelectorAll('#score [data-note]').length!==2)throw Error('Changing bass duration changed the treble note');
  click('#score [data-note][data-staff="2"]');click('[data-action="chord"]');click('[data-pitch="E3"]');await pause();
  if(!document.querySelector('[data-action="chord-tone"]'))throw Error('Chord tone was not added or editable');
  click('[data-action="chord-tone"]');click('[data-pitch="F3"]');await pause();
  if(!document.querySelector('[data-action="chord-tone"]')?.textContent.includes('F3'))throw Error('Chord tone could not be edited');
  const toneFinger=document.querySelector('[data-tone-finger="0"]');if(!toneFinger)throw Error('Chord-tone fingering control is missing');toneFinger.value='3';toneFinger.dispatchEvent(new Event('change',{bubbles:true}));await pause();
  if(document.querySelector('[data-tone-finger="0"]')?.value!=='3')throw Error('Chord-tone fingering was not retained');
  click('[data-action="note-mark"][data-field="arpeggio"]');await pause();
  const direction=document.querySelector('[data-arpeggio-direction]');if(!direction)throw Error('Arpeggio direction control is missing');direction.value='down';direction.dispatchEvent(new Event('change',{bubbles:true}));await pause();
  if(document.querySelector('[data-arpeggio-direction]')?.value!=='down')throw Error('Arpeggio direction was not retained');
  await new Promise(resolve=>setTimeout(resolve,600));
  click('#score [data-note][data-staff="2"]');
  const bassHit=document.querySelector('#score [data-note][data-staff="2"]'),bounds=bassHit.getBoundingClientRect();
  const x=bounds.left+bounds.width/2,y=bounds.top+bounds.height/2;
  bassHit.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerId:7,pointerType:'touch',clientX:x,clientY:y}));
  window.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,pointerId:7,pointerType:'touch',clientX:x,clientY:y-24}));
  window.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerId:7,pointerType:'touch',clientX:x,clientY:y-24}));await pause();
  if(!document.querySelector('[data-action="chord-tone"]')?.textContent.includes('A3'))throw Error('Pitch drag did not move the bass chord');
  window.Notation.command('undo');await pause();
  await new Promise(resolve=>setTimeout(resolve,600));
  click('#score [data-note][data-staff="2"]');
  if(!document.querySelector('[data-action="chord-tone"]')?.textContent.includes('F3'))throw Error('Undo did not restore the dragged chord');
  window.Notation.command('delete-note-rest');await pause();
  if(document.querySelector('[data-action="chord-tone"]'))throw Error('Chord controls remained after conversion to rest');
  window.Notation.command('undo');await pause();
  click('#score [data-note][data-staff="2"]');
  if(!document.querySelector('[data-action="chord-tone"]')?.textContent.includes('F3'))throw Error('Undo did not restore the chord from rest');
  click('[data-action="metadata"]');await pause();
  const singleForm=document.getElementById('metadata');singleForm.elements.instrument.value='guitar';
  singleForm.elements.instrument.dispatchEvent(new Event('change',{bubbles:true}));
  document.getElementById('metadata').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await pause();
  click('dialog [data-action="cancel-change"]');await pause();
  if(!document.getElementById('metadata'))throw Error('Cancelling instrument change left the form');
  document.getElementById('metadata').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await pause();
  click('dialog [data-action="keep-hidden"]');await pause();
  if(document.querySelector('#score [data-staff="2"]')||!document.querySelector('.hidden-staff-warning'))
   throw Error('Switch to a single staff did not preserve hidden bass notes');
  click('[data-action="metadata"]');await pause();
  const grandForm=document.getElementById('metadata');grandForm.elements.instrument.value='piano';
  grandForm.elements.instrument.dispatchEvent(new Event('change',{bubbles:true}));
  document.getElementById('metadata').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await pause();
  if(!document.querySelector('#score [data-note][data-staff="2"]'))throw Error('Bass note did not return after switching back to piano');
  click('[data-action="metadata"]');await pause();
  const transferForm=document.getElementById('metadata');transferForm.elements.instrument.value='guitar';
  transferForm.elements.instrument.dispatchEvent(new Event('change',{bubbles:true}));
  document.getElementById('metadata').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await pause();
  click('dialog [data-action="transfer-notes"]');await pause();
  if(document.querySelector('.hidden-staff-warning')||document.querySelectorAll('#score [data-note][data-staff="1"]').length<2)throw Error('Transferring bass notes to the upper staff failed');
  window.Notation.command('undo');await pause();
  if(!document.querySelector('#score [data-note][data-staff="2"]'))throw Error('Undo did not restore the bass staff after instrument change');
  click('#score [data-note][data-staff="2"]');window.Notation.command('delete-note-compact');await pause();
  if(!document.querySelector('#score [data-note][data-staff="2"]')||!document.querySelector('#score [data-note][data-staff="1"]'))
   throw Error('Compact deletion lost a staff or its timing rest');
  click('#score [data-note][data-staff="2"]');
  if(document.querySelector('[data-action="chord-tone"]'))throw Error('Compact deletion retained the bass chord');
  window.Notation.command('undo');await pause();
  click('#score [data-note][data-staff="2"]');
  if(!document.querySelector('[data-action="chord-tone"]'))throw Error('Undo did not restore the bass chord');
  window.Notation.command('redo');await pause();
  click('#score [data-note][data-staff="2"]');
  if(document.querySelector('[data-action="chord-tone"]'))throw Error('Redo did not restore the bass rest');
  const setMeasure=(key,value)=>{const control=document.querySelector(`[data-measure-choice="${key}"]`);if(!control)throw Error('Missing measure control '+key);control.value=value;control.dispatchEvent(new Event('change',{bubbles:true}));};
  setMeasure('time','7/8');await pause();
  if(document.querySelector('[data-measure-choice="time"]')?.value!=='7/8')throw Error('Time signature change was not retained');
  setMeasure('repeatLine','start');await pause();
  if(document.querySelector('[data-measure-choice="repeatLine"]')?.value!=='start')throw Error('Repeat start could not be edited');
  click('[data-action="add-bar"]');await pause();
  if(document.querySelector('.measure-tools summary')?.textContent.trim()!=='Measure tools 2')throw Error('Measure insertion was not exposed');
  click('.staff-picker [data-staff="1"]');click('[data-action="voice"][data-voice="2"]');
  click('[data-action="duration"][data-value="8"]');
  const tuplet=document.querySelector('[data-tuplet]');if(!tuplet)throw Error('Tuplet control is missing');tuplet.value='3:2';tuplet.dispatchEvent(new Event('change',{bubbles:true}));await pause();
  for(let i=0;i<3;i++)click('[data-pitch="C5"]');await pause();
  if(document.querySelectorAll('#score [data-bar="1"][data-note]').length!==3)throw Error('Triplet notes in the second voice could not be written');
  click('#score [data-bar="1"][data-note]');click('[data-action="copy-notes"]');await pause();
  click('[data-action="add-bar"]');await pause();
  click('[data-action="paste-notes"]');await pause();
  if(document.querySelectorAll('#score [data-bar="2"][data-note]').length!==1)throw Error('Copied note was not pasted into a new measure');
  window.Notation.command('undo');await pause();
  if(document.querySelectorAll('#score [data-bar="2"][data-note]').length)throw Error('Paste did not undo as one operation');
  window.Notation.command('redo');await pause();
  if(document.querySelectorAll('#score [data-bar="2"][data-note]').length!==1)throw Error('Redo did not restore pasted notes');
  click('#score [data-bar="2"][data-note]');await pause();
  const lyric=document.querySelector('[data-note-lyric]');if(!lyric)throw Error('Lyric editor is missing');lyric.value='Hello';lyric.dispatchEvent(new Event('change',{bubbles:true}));await pause();
  if(document.querySelector('[data-note-lyric]')?.value!=='Hello')throw Error('Lyric edit was not retained');
  const chord=document.querySelector('[data-note-chord-symbol]');chord.value='Cm7';chord.dispatchEvent(new Event('change',{bubbles:true}));await pause();
  if(document.querySelector('[data-note-chord-symbol]')?.value!=='Cm7')throw Error('Chord symbol edit was not retained');
  const rehearsal=document.querySelector('[data-measure-text="rehearsal"]');rehearsal.value='B';rehearsal.dispatchEvent(new Event('change',{bubbles:true}));await pause();
  if(document.querySelector('[data-measure-text="rehearsal"]')?.value!=='B')throw Error('Rehearsal mark edit was not retained');
  const displayNumber=document.querySelector('[data-measure-number="displayNumber"]');displayNumber.value='42';displayNumber.dispatchEvent(new Event('change',{bubbles:true}));await pause();
  if(document.querySelector('[data-measure-number="displayNumber"]')?.value!=='42')throw Error('Measure number edit was not retained');
  click('[data-action="grace-mode"]');click('[data-pitch="D4"]');await pause();
  if(document.querySelectorAll('[data-action="remove-grace"]').length!==1)throw Error('Grace note was not attached to selected note');
  click('[data-action="remove-grace"]');await pause();
  if(document.querySelector('[data-action="remove-grace"]'))throw Error('Grace note could not be removed');
  const octave=document.querySelector('[data-note-octave-shift]');octave.value='8va';octave.dispatchEvent(new Event('change',{bubbles:true}));await pause();
  if(document.querySelector('[data-note-octave-shift]')?.value!=='8va')throw Error('Octave shift edit was not retained');
  const size=document.querySelector('[data-note-size]');size.value='cue';size.dispatchEvent(new Event('change',{bubbles:true}));await pause();
  if(document.querySelector('[data-note-size]')?.value!=='cue')throw Error('Cue note edit was not retained');
  document.querySelector('[data-note-size]').value='small';document.querySelector('[data-note-size]').dispatchEvent(new Event('change',{bubbles:true}));await pause();
  if(document.querySelector('[data-note-size]')?.value!=='small')throw Error('Small note edit was not retained');
  const ornament=document.querySelector('[data-choice="ornament"]');ornament.value='trill';ornament.dispatchEvent(new Event('change',{bubbles:true}));await pause();
  const upperAccidental=document.querySelector('[data-ornament-accidental="ornamentUpperAccidental"]');if(!upperAccidental)throw Error('Ornament accidental control is missing');upperAccidental.value='#';upperAccidental.dispatchEvent(new Event('change',{bubbles:true}));await pause();
  if(document.querySelector('[data-ornament-accidental="ornamentUpperAccidental"]')?.value!=='#')throw Error('Ornament accidental was not retained');
  click('[data-action="add-bar"]');await pause();
  const multiRest=document.querySelector('[data-measure-choice="multiRest"]');multiRest.value='2';multiRest.dispatchEvent(new Event('change',{bubbles:true}));await pause();
  if(document.querySelector('[data-measure-choice="multiRest"]')?.value!=='2'||!document.querySelector('#score .notation-multi-rest'))throw Error('Multi-measure rest could not be edited');
  window.Notation.command('undo');await pause();
  if(document.querySelector('[data-measure-choice="multiRest"]')?.value==='2')throw Error('Multi-measure rest did not undo');
  document.body.dataset.result='passed';
 } catch(error) {document.body.dataset.result='failed: '+error.message;}
},100);
</script>
</body>
</html>
