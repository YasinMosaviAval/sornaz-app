<script>
window.onerror=(_,__,___,____,error)=>document.body.dataset.result='FAIL '+(error?.message||_);
window.fetch=async url=>({ok:true,json:async()=>({success:true,data:String(url).endsWith('/instruments')?[{id:'Piano',staves:[{clef:'treble'},{clef:'bass'}]}]:{items:[],has_more:false}})});
window.NOTATION_BOOT={locale:'en',embedded:false,api:'/music-sheets/api',userId:1};
</script>
<script src="../assets/notation/vendor/vexflow.js"></script><script src="../assets/notation/model.js"></script><script src="../assets/notation/ui_symbols.js"></script><script src="../assets/notation/score_renderer.js"></script><script src="../assets/notation/importer.js"></script><script src="../assets/notation/notation.js"></script>
<script>
(async()=>{try{
 await new Promise(resolve=>setTimeout(resolve,100));
 const M=NotationModel,s=M.fresh();Object.assign(s.metadata,{title:'Imported two hands',instrument:'Piano',staves:[{clef:'treble'},{clef:'bass'}]});s.score.measures=[{notes:[{pitch:'C4',duration:'q',staff:1,voice:1,at:0},{pitch:'C3',duration:'q',staff:2,voice:1,at:0,pitches:[{pitch:'E3'}]}]},{notes:[],preserve:true}];const json=JSON.stringify({format:'sornaz-notation',version:1,metadata:s.metadata,score:s.score});
 const cancelled=Notation.importContent(json,'score.json');await new Promise(resolve=>setTimeout(resolve,20));document.querySelector('[data-action="cancel-import"]').click();if(await cancelled!==false||document.querySelector('#score'))throw Error('Cancel changed the document');
 const confirmed=Notation.importContent(json,'score.json');await new Promise(resolve=>setTimeout(resolve,20));if(!document.querySelector('.import-score-preview svg'))throw Error('Score preview missing');document.querySelector('[data-action="confirm-import"]').click();if(await confirmed!==true||!document.querySelector('#score')||!(document.querySelector('.score-title h2')?.textContent||'').includes('Imported two hands'))throw Error('Import failed');
 Notation.command('undo');await new Promise(resolve=>setTimeout(resolve,20));if((document.querySelector('.score-title h2')?.textContent||'').includes('Imported two hands'))throw Error('One-step undo failed');
 Notation.command('redo');await new Promise(resolve=>setTimeout(resolve,20));if(!(document.querySelector('.score-title h2')?.textContent||'').includes('Imported two hands'))throw Error('Redo failed');
 document.body.dataset.result='PASS';
}catch(e){document.body.dataset.result='FAIL '+e.message;}})();
</script>
