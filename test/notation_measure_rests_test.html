<!doctype html><html><meta charset="utf-8"><style>body{margin:0;background:white;font:12px Arial}main{width:100%}.note-hit{pointer-events:all}h3{margin:8px}</style><body data-result="pending"><h3>Partial and empty measures</h3><main id="partial"></main><h3>One- and two-measure repeats</h3><main id="repeat"></main><main id="cases"></main>
<script src="../assets/notation/vendor/vexflow.js"></script><script src="../assets/notation/model.js"></script><script src="../assets/notation/score_renderer.js"></script>
<script>
try{
 const M=NotationModel,R=NotationRenderer,u=M.wholeUnits,expect=(v,m)=>{if(!v)throw Error(m);},cases=document.getElementById('cases');
 const note=(pitch='C4',duration='q',at=0,extra={})=>({pitch,duration,at,dots:0,staff:1,voice:1,...extra});
 const draw=(sheet,target=cases,options={})=>{const saved=JSON.stringify(sheet);R.draw(target,sheet,{accent:'#0065ff',...options});expect(JSON.stringify(sheet)===saved,'Engraving modified stored score');return target;};
 const generated=(target=cases)=>[...target.querySelectorAll('.notation-auto-rest')],sum=nodes=>nodes.reduce((a,n)=>a+Number(n.dataset.units),0);
 const partial=M.fresh();partial.score.measures=[{notes:[note()]},{notes:[],preserve:true},{notes:[note('D4','8',0,{rest:true})]}];draw(partial,document.getElementById('partial'),{ghostBar:0,ghost:note('E4')});
 const partialRoot=document.getElementById('partial');expect(sum(generated(partialRoot).filter(n=>n.dataset.bar==='0'))===u*3/4,'Partial quarter measure is not completed');expect(partialRoot.querySelectorAll('.notation-measure-rest[data-bar="1"]').length===1,'Empty measure lacks whole-measure rest');expect(partialRoot.querySelector('.notation-preview-note'),'Insertion preview was lost');expect(partialRoot.querySelectorAll('[data-note]').length===2,'Automatic rests became editable notes');
 for(const time of ['3/4','6/8','5/8','7/8','2/2','3/2','1/16','19/32']){const s=M.fresh();s.metadata.time=time;s.score.measures=[{notes:[],preserve:true}];draw(s);expect(cases.querySelectorAll('.notation-measure-rest').length===1,'Missing measure rest for '+time);expect(Number(cases.querySelector('.notation-measure-rest').dataset.units)===M.barUnits(s,0),'Wrong measure-rest duration '+time);expect(!generated().length,'Empty measure was split into duration rests');}
 const pickup=M.fresh();pickup.score.measures=[{length:u/4,notes:[note('C4','8')]}];draw(pickup);expect(sum(generated())===u/8,'Pickup rest exceeds measure length');
 const holes=M.fresh();holes.score.measures=[{notes:[note('C4','q',u/2)]}];draw(holes);expect(sum(generated())===3*u/4&&generated().some(n=>Number(n.dataset.at)===0),'Interior/leading gaps were not filled');
 const separated=M.fresh();separated.score.measures=[{notes:[note('C4','8'),note('D4','8',u/2)]}];draw(separated);expect(cases.querySelectorAll('.vf-beam').length===0,'Automatic rests did not break the beam across a gap');
 const dottedBeam=M.fresh();dottedBeam.score.measures=[{notes:[note('C4','8',0,{dots:1}),note('D4','16',3*u/16)]}];draw(dottedBeam);expect(cases.querySelectorAll('.vf-beam').length===1,'Dotted eighth and sixteenth did not share their quarter beat');
 const compound=M.fresh();compound.metadata.time='6/8';compound.score.measures=[{notes:[note()]}];draw(compound);expect(sum(generated())===u/2,'Compound measure missing remaining duration');expect(generated().some(n=>n.dataset.duration==='q'&&n.dataset.dots==='1'),'Compound beat not grouped as dotted-quarter rest');
 const triplet=M.fresh();triplet.score.measures=[{notes:[note('C4','q',0,{tuplet:{actual:3,normal:2}})]}];draw(triplet);expect(sum(generated())===u-M.units(triplet.score.measures[0].notes[0]),'Tuplet completion is inexact');
 for(const duration of Object.keys(M.durations))for(const dots of [0,1,2])for(const ratio of ['', '3:2','5:4','7:4','4:3','6:4','9:8']){const n=note('C4',duration,0,{dots});if(ratio){const[actual,normal]=ratio.split(':').map(Number);n.tuplet={actual,normal};}let units;try{units=M.units(n);}catch(error){if(error.message==='Tuplet duration is not integral.')continue;throw error;}if(units>u)continue;const s=M.fresh();s.score.measures=[{notes:[n]}];draw(s);expect(sum(generated())===u-units,'Inexact completion '+duration+':'+dots+' / '+ratio);}
 const long=M.fresh();long.metadata.time='32/1';long.score.measures=[{notes:[note()]}];draw(long);expect(sum(generated())===M.barUnits(long,0)-u/4,'Long manual meter completion is inexact');
 const voices=M.fresh();voices.metadata.staves=[{clef:'treble'},{clef:'bass'}];voices.score.measures=[{notes:[note(),note('E4','8',0,{voice:2})]}];draw(voices);expect(sum(generated().filter(n=>n.dataset.voice==='1'))===3*u/4&&sum(generated())===7*u/8,'Shared rests did not cover both voices exactly');expect(cases.querySelector('.notation-measure-rest[data-staff="2"]'),'Empty bass staff has no measure rest');
 const sample=M.fresh();sample.metadata.clef='bass';sample.score.measures=[{notes:['C3','D3','E3','D3'].map((p,i)=>note(p,'q',i*u/4))},{notes:['E3','D3','E3','C3'].map((p,i)=>note(p,'q',i*u/4))},{notes:[],repeat:{measure:1}},{notes:[],repeat:{measure:2}},{notes:[]}];expect(M.trimmedMeasures(sample).length===5,'Second half of repeat was trimmed');const prepared=M.clone(sample);M.prepare(prepared);expect(prepared.score.measures.length===5,'Preparation removed repeat continuation');M.performanceOrder(prepared);document.getElementById('repeat').style.width='1200px';draw(sample,document.getElementById('repeat'));
 const repeat=document.getElementById('repeat'),single=repeat.querySelector('[data-repeat-count="1"]'),double=repeat.querySelector('[data-repeat-count="2"]');expect(single&&double&&repeat.querySelectorAll('.notation-measure-repeat,[class*="vf-notation-measure-repeat"]').length===2,'Repeat glyphs missing/duplicated');
 const hit=(bar)=>repeat.querySelector('.note-hit[data-bar="'+bar+'"]:not([data-note])'),r=el=>el.getBoundingClientRect(),singleBox=r(single),doubleBox=r(double),a=r(hit(2)),b=r(hit(3)),c=r(hit(4));
 expect(Math.abs((singleBox.left+singleBox.right)/2-(a.left+a.right)/2)<.1,'Single repeat is not centered');expect(Math.abs((doubleBox.left+doubleBox.right)/2-b.right)<.1&&Math.abs(b.right-c.left)<.1,'Two-bar repeat is not centered on inner barline');expect(Math.abs(singleBox.top+singleBox.height/2-Number(single.dataset.centerY)*single.ownerSVGElement.getScreenCTM().d-single.ownerSVGElement.getScreenCTM().f)<.2,'Repeat not vertically centered');
 expect(Math.abs((singleBox.left-a.left)-(doubleBox.left-b.left))<.2&&Math.abs((a.right-singleBox.right)-(c.right-doubleBox.right))<.2,'Repeat padding differs between one and two bars');expect(a.width<r(hit(1)).width,'Single repeat measure was not compressed');expect(!generated(repeat).length&&!repeat.querySelector('.notation-measure-rest'),'Repeat measures gained rests');expect(repeat.querySelector('.notation-repeat-count')?.textContent==='2','Two-bar repeat number missing');
 for(const width of [280,500,900]){let index=0;for(const row of R.groups(sample.score.measures,width,false)){for(let i=0;i<row.length;i++)if(row[i].repeat?.measure===2)expect(i+1<row.length,'Two-bar repeat split across systems');index+=row.length;}expect(index===5,'Grouping lost a measure');}
 const printBoundary=M.clone(sample);printBoundary.score.measures.splice(2,0,...Array.from({length:5},()=>({notes:[note()]})));for(const row of R.groups(printBoundary.score.measures,1000,true))for(let i=0;i<row.length;i++)if(row[i].repeat?.measure===2)expect(i+1<row.length,'Two-bar repeat split in print');
 const printed=R.printDocument(sample),parsed=new DOMParser().parseFromString(printed,'text/html');expect(parsed.querySelectorAll('[data-repeat-count="1"]').length===1&&parsed.querySelectorAll('[data-repeat-count="2"]').length===1,'Printed repeats differ from screen');expect(!parsed.querySelector('.notation-preview-note'),'Preview leaked into print');
 const printedPartial=new DOMParser().parseFromString(R.printDocument(partial),'text/html');expect(printedPartial.querySelector('.notation-auto-rest')&&printedPartial.querySelector('.notation-measure-rest'),'Printed rests missing');
 for(const test of [{time:'4/4',duration:'8',count:8,unit:'q',dots:0,beams:4},{time:'6/8',duration:'8',count:6,unit:'q',dots:1,beams:2},{time:'6/8',duration:'8',count:6,unit:'8',dots:0,beams:0},{time:'7/16',duration:'16',count:7,unit:'q',dots:2,beams:1},{time:'4/4',duration:'16',count:16,unit:'q',dots:2,beams:3},{time:'6/8',duration:'8',count:6,unit:'q',dots:1,pattern:'2+2+2',beams:3}]){const s=M.fresh();Object.assign(s.metadata,{time:test.time,tempo_note:test.unit,tempo_dots:test.dots});s.score.measures=[{notes:Array.from({length:test.count},(_,i)=>note(i%2?'D4':'C4',test.duration,i*M.units({duration:test.duration}))),...(test.pattern?{beamPattern:test.pattern}:{})}];draw(s);expect(cases.querySelectorAll('.vf-beam').length===test.beams,'Beaming ignored beat unit '+JSON.stringify(test));const print=new DOMParser().parseFromString(R.printDocument(s),'text/html');expect(print.querySelectorAll('.vf-beam').length===test.beams,'Print beaming differs from beat unit');}
 repeat.style.width='';draw(sample,repeat);cases.replaceChildren();document.body.dataset.result='PASS';
}catch(error){document.body.dataset.result='FAIL '+error.message;}
</script></body></html>
