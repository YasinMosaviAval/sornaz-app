<!doctype html><html><meta charset="utf-8"><style>body{margin:0}.note-hit{display:none}</style><body data-result="pending"><main id="plain"></main><main id="decorated"></main><main id="grand"></main><main id="crowded"></main>
<script src="../assets/notation/vendor/vexflow.js"></script><script src="../assets/notation/model.js"></script><script src="../assets/notation/score_renderer.js"></script>
<script>
try{
 const expect=(v,m)=>{if(!v)throw Error(m);},clone=NotationModel.clone,base=NotationModel.fresh();
 base.score.measures=Array.from({length:8},()=>({notes:[{pitch:'C4',duration:'q',staff:1,voice:1,at:0}]}));
 NotationRenderer.draw(document.getElementById('plain'),base,{});
 const svgs=[...document.querySelectorAll('#plain svg')];expect(svgs.length>1,'Expected multiple systems');
 const ink=svg=>{const b=svg.getBBox(),m=svg.getScreenCTM();return {top:b.y*m.d+m.f,bottom:(b.y+b.height)*m.d+m.f,b,scale:m.d};};
 const first=ink(svgs[0]),second=ink(svgs[1]),oldGap=120+(second.b.y-first.b.y-first.b.height)*first.scale,newGap=second.top-first.bottom;
 expect(Math.abs(newGap-oldGap/2)<1.5,'Empty system spacing was not halved: '+newGap+' / '+oldGap);
 const marked=clone(base);for(const bar of marked.score.measures){bar.text='Phrase';bar.rehearsal='A';bar.tempo={mode:'instant',bpm:120};bar.notes[0].lyric='lyric';bar.notes[0].dynamic='fff';}
 NotationRenderer.draw(document.getElementById('decorated'),marked,{});
 const markedRows=[...document.querySelectorAll('#decorated svg')];expect(markedRows[0].getBoundingClientRect().height>svgs[0].getBoundingClientRect().height,'Annotations did not expand spacing');
 for(let i=1;i<markedRows.length;i++)expect(ink(markedRows[i]).top>=ink(markedRows[i-1]).bottom,'Annotations overlap between systems');
 const grand=clone(base);grand.metadata.staves=[{clef:'treble'},{clef:'bass'}];grand.metadata.clef='treble';for(const bar of grand.score.measures)bar.notes=[{pitch:'C5',duration:'q',staff:1,voice:1,at:0},{pitch:'C3',duration:'q',staff:2,voice:1,at:0}];
 NotationRenderer.draw(document.getElementById('grand'),grand,{});const plainStep=Number(document.querySelector('#grand svg').dataset.staffStep);expect(plainStep===95,'Plain grand-staff gap should halve from 110 to 55');
 const crowded=clone(grand);for(const bar of crowded.score.measures)Object.assign(bar.notes[0],{lyric:'Upper lyric',dynamic:'fff',pedal:'sustainDown'});
 NotationRenderer.draw(document.getElementById('crowded'),crowded,{});
 for(const svg of document.querySelectorAll('#crowded svg')){expect(Number(svg.dataset.staffStep)>plainStep,'Crowded grand staff did not expand');const boxes=staff=>[...svg.querySelectorAll('[class*="notation-staff-'+staff+'"]')].map(n=>n.getBBox());expect(Math.min(...boxes(2).map(b=>b.y))-Math.max(...boxes(1).map(b=>b.y+b.height))>=9.9,'Upper/lower staff ink overlaps');}
 expect(NotationRenderer.printDocument(grand).includes('data-staff-step="150"'),'Print layout changed');
 document.body.dataset.result='PASS';
}catch(e){document.body.dataset.result='FAIL '+e.message;}
</script></body></html>
