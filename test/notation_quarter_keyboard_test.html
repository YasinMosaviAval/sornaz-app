<!doctype html><html><meta charset="utf-8"><link rel="stylesheet" href="../assets/notation/notation.css"><link rel="stylesheet" href="../assets/notation/ui_controls.css"><body data-result="pending"><main id="app"></main><div id="toast"></div>
<script>
window.NOTATION_BOOT={locale:new URL(location.href).searchParams.get('locale')||'fa',userId:1,embedded:true,nativeToolbar:true,durationMode:2};
window.SornazNotation={postMessage(raw){const d=JSON.parse(raw);if(!d.id)return;let value=true;if(d.action==='list')value={items:[],has_more:false};if(d.action==='instruments')value=[{id:'Tar',en:'Tar',fa:'تار'}];if(d.action==='export')window.exported=JSON.parse(d.content);queueMicrotask(()=>Notation.receive(d.id,value,null));}};
</script>
<script src="../assets/notation/vendor/vexflow.js"></script><script src="../assets/notation/piano_style.js"></script><script src="../assets/notation/model.js"></script><script src="../assets/notation/ui_symbols.js"></script><script src="../assets/notation/ui_glyphs.js"></script><script src="../assets/notation/score_renderer.js"></script><script src="../assets/notation/importer.js"></script><script src="../assets/notation/ui_controls.js"></script><script src="../assets/notation/notation.js"></script>
<script>
(async()=>{const pause=()=>new Promise(r=>setTimeout(r,50)),find=s=>document.querySelector(s),expect=(v,m)=>{if(!v)throw Error(m);},click=s=>{const e=find(s);expect(e,'Missing '+s);e.click();if(e.matches('[data-pitch]'))document.querySelector('.note-duration-picker .active')?.click();};try{
 await pause();const s=NotationModel.fresh();s.metadata.title='Quarter keyboard';s.score.measures[0].notes=[{pitch:'C4',duration:'q',rest:false}];const task=Notation.importContent(JSON.stringify({format:'sornaz-notation',version:1,metadata:s.metadata,score:s.score}),'keyboard.json');await pause();click('[data-action=confirm-import]');await task;
 await document.fonts.load('40px Bravura');expect(document.fonts.check('40px Bravura'),'Official Bravura font is not loaded');
 const probe=document.createElement('div');document.body.append(probe);for(const duration of ['w','h','q','8','16','32','64','128','256'])for(const kind of ['note','rest']){probe.innerHTML=NotationSymbols[kind](duration);const svg=probe.querySelector('svg'),text=svg.querySelector('text');expect(svg.dataset.musicFont==='Bravura'&&getComputedStyle(text).fontFamily.includes('Bravura'),'Non-Bravura duration '+duration);expect(text.textContent.codePointAt(0)>=0xE000&&svg.viewBox.baseVal.width>0&&svg.viewBox.baseVal.height>0,'Invalid SMuFL glyph');}probe.remove();
 const triggers=[...document.querySelectorAll('.notation-sheet-trigger')],rects=triggers.map(n=>n.getBoundingClientRect());expect(triggers.length===3&&triggers.every(n=>n.closest('.editor-header')&&!n.querySelector('span')),'Tool launchers are not icon-only in the header');expect(!find('.keyboard-wrap [data-action=palette]')&&!find('[data-control-group=Measure]'),'Obsolete keyboard/measure launcher remains');
 for(const id of ['voices','measure','palette']){click('[data-tool-sheet='+id+']');await pause();const dialog=find('.notation-tool-sheet');expect(dialog?.matches(':modal')&&Math.abs(dialog.getBoundingClientRect().bottom-innerHeight)<2,'Tool dialog is not a bottom modal');expect(dialog.querySelectorAll('.palette-group').length>0,'Missing tool categories');click('[data-action=close-tool-sheet]');await pause();expect(!find('.notation-tool-sheet'),'Tool dialog does not close');}
 click('[data-tool-sheet=voices]');click('[data-action=voice][data-voice="2"]');await pause();expect(find('[data-action=voice][data-voice="2"]').getAttribute('aria-pressed')==='true'&&find('.notation-tool-sheet').open,'Voice change closed the dialog');click('[data-action=voice][data-voice="1"]');click('[data-action=close-tool-sheet]');await pause();
 expect(!find('.quarter-key'),'Western scale displays quarter tones');Notation.configure({showQuarterTones:true});await pause();expect(!find('.quarter-key'),'Legacy preference overrode Western scale');
 Notation.command('metadata');await pause();const form=find('#metadata');form.elements.scale_type.value='iran_shur';form.elements.scale_type.dispatchEvent(new Event('change',{bubbles:true}));await pause();find('#metadata').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await pause();expect(document.querySelectorAll('.quarter-key').length===87,'Iranian scale does not automatically show quarter tones');
 const pianoKeys=[...document.querySelectorAll('.piano [data-pitch]')],frequencies=pianoKeys.map(k=>NotationModel.frequency(k.dataset.pitch,k.dataset.accidental||''));expect(new Set(frequencies.map(v=>v.toFixed(7))).size===175,'Duplicated or missing piano pitches');
 expect(find('.sori-key .quarter-sign').textContent.codePointAt(0)===0xE461&&find('.koron-key .quarter-sign').textContent.codePointAt(0)===0xE460,'Quarter-tone signs are missing');
 const black=find('.piano .black').getBoundingClientRect(),quarter=find('.quarter-key').getBoundingClientRect();expect(Math.abs(black.width-quarter.width)<1&&quarter.height<black.height&&Math.abs(quarter.top-black.top)<1,'Quarter-key geometry differs from tuner');
 const spec=SornazPianoStyle;expect(find('.piano .white').getBoundingClientRect().height===spec.whiteHeight&&black.height===spec.blackHeight&&quarter.height===spec.quarterHeight&&quarter.width===spec.blackWidth,'Piano dimensions differ from shared spec');
 for(const [selector,color] of [['.koron-key',spec.koronColor],['.sori-key',spec.soriColor]]){const probe=document.createElement('i');probe.style.backgroundColor=color;document.body.append(probe);expect(getComputedStyle(find(selector)).backgroundColor===getComputedStyle(probe).backgroundColor,'Piano color differs from tuner');probe.remove();}
 click('.quarter-key[data-pitch="D4"][data-accidental=k]');await pause();Notation.command('export');await pause();const note=exported.score.measures[0].notes.find(n=>n.pitch==='D4');expect(note?.accidental==='k','Quarter-tone key inserted an ordinary pitch');expect(Math.abs(NotationModel.timeline({metadata:exported.metadata,score:exported.score}).events[1].hz-NotationModel.frequency('D4','k'))<1e-8,'Quarter-tone playback mismatch');
 Notation.configure({showQuarterTones:false});await pause();expect(!!find('.quarter-key'),'Legacy preference hid Iranian keys');Notation.command('metadata');await pause();find('#metadata').elements.scale_type.value='major';find('#metadata').elements.scale_type.dispatchEvent(new Event('change',{bubbles:true}));await pause();find('#metadata').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await pause();expect(!find('.quarter-key'),'Western scale did not hide quarter tones');Notation.command('export');await pause();expect(exported.score.measures[0].notes.some(n=>n.accidental==='k'),'Hiding keys changed the score');
 document.body.dataset.result='PASS';
}catch(e){document.body.dataset.result='FAIL '+e.message;}})();
</script></body></html>
