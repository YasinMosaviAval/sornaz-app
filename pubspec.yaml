name: sornaz
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.3.1
  provider: ^6.1.2
  go_router: ^16.3.0
  flutter_svg: ^2.0.10+1
  http: ^1.2.2
  flutter_html: ^3.0.0-beta.2
  flutter_html_iframe: ^3.0.0
  metronome: ^2.0.7
  shared_preferences: ^2.3.2
  shamsi_date: ^1.0.1
  flutter_rating_bar: ^4.0.1
  flutter_pitch_detection: ^1.3.0
  permission_handler: ^11.3.1
  audioplayers: ^6.1.0
  file_picker: ^8.1.3
  cupertino_icons: ^1.0.8
  dtd: ^4.0.0
  # flutter_lints: ^6.0.0
  google_fonts: ^6.3.2
  json_rpc_2: ^4.0.0
  path: ^1.9.1
  stack_trace: ^1.12.1
  url_launcher: ^6.3.2
  record: ^6.1.2
  path_provider: ^2.1.4
  just_waveform: ^0.0.7
  metadata_god: ^1.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  flutter_localizations:
    sdk: flutter


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  # build_runner: ^2.4.6
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/tick.wav
    - assets/audio/accent.wav
  fonts:
    - family: iran_sansx_fn
      fonts:
        - asset: assets/fonts/iran_sansx_fn/ultra_light.ttf
          weight: 100
        - asset: assets/fonts/iran_sansx_fn/light.ttf
          weight: 200
        - asset: assets/fonts/iran_sansx_fn/thin.ttf
          weight: 300
        - asset: assets/fonts/iran_sansx_fn/regular.ttf
          weight: 400
        - asset: assets/fonts/iran_sansx_fn/medium.ttf
          weight: 500
        - asset: assets/fonts/iran_sansx_fn/demi_bold.ttf
          weight: 600
        - asset: assets/fonts/iran_sansx_fn/bold.ttf
          weight: 700
        - asset: assets/fonts/iran_sansx_fn/extra_bold.ttf
          weight: 800
        - asset: assets/fonts/iran_sansx_fn/black.ttf
          weight: 900

