plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def uploadPropertiesFile = rootProject.file('key.properties')
def uploadProperties = new Properties()
if (uploadPropertiesFile.exists()) {
    uploadPropertiesFile.withInputStream { uploadProperties.load(it) }
}

android {
    namespace = "com.example.sornaz"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.sornaz"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // The ARM64-only bundle also filters prebuilt libraries from plugins.
        if (project.findProperty('sornaz-arm64-only') == 'true') {
            ndk {
                abiFilters.clear()
                abiFilters.add('arm64-v8a')
            }
        }
    }


    signingConfigs {
        release {
            keyAlias = uploadProperties['keyAlias']
            keyPassword = uploadProperties['keyPassword']
            storeFile = uploadProperties['storeFile'] ? rootProject.file(uploadProperties['storeFile']) : null
            storePassword = uploadProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            ndk { debugSymbolLevel = 'SYMBOL_TABLE' }
        }
    }
}

dependencies {
    implementation "androidx.media3:media3-transformer:1.9.2"
    implementation "androidx.media3:media3-effect:1.9.2"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.3"
    
    // بقیه dependencies شما...
}

flutter {
    source = "../.."
}

// Resolve the exact release artifacts without compiling or packaging an APK.
tasks.register('verifyOfflineReleaseDependencies') {
    doLast {
        if (!gradle.startParameter.offline) {
            throw new GradleException('Run with --offline to verify offline readiness.')
        }
        ['releaseCompileClasspath', 'releaseRuntimeClasspath'].each { name ->
            def artifacts = configurations.getByName(name).incoming.artifactView {
                componentFilter { id -> id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                attributes {
                    attribute(org.gradle.api.artifacts.type.ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'android-classes-jar')
                }
            }.files
            artifacts.each { artifact ->
                if (!artifact.isFile()) throw new GradleException("Missing artifact: " + artifact)
            }
            println("Verified offline " + name + ": " + artifacts.size() + " artifacts")
        }
    }
}

// Never produce a release artifact with a fallback debug key or no signature.
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.doFirst {
            def required = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
            if (!uploadPropertiesFile.isFile() || required.any { !uploadProperties[it]?.trim() || uploadProperties[it].startsWith('REPLACE_WITH_') }) {
                throw new GradleException('Release signing requires android/key.properties with storeFile, storePassword, keyAlias and keyPassword. Keep passwords local; no debug fallback is allowed.')
            }
            if (!rootProject.file(uploadProperties['storeFile']).isFile()) {
                throw new GradleException('The upload keystore configured in android/key.properties does not exist.')
            }
        }
    }
}