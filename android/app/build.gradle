plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.sornaz"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.sornaz"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {
    implementation "androidx.media3:media3-transformer:1.9.2"
    implementation "androidx.media3:media3-effect:1.9.2"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.3"
    
    // بقیه dependencies شما...
}

flutter {
    source = "../.."
}

// Resolve the exact release artifacts without compiling or packaging an APK.
tasks.register('verifyOfflineReleaseDependencies') {
    doLast {
        if (!gradle.startParameter.offline) {
            throw new GradleException('Run with --offline to verify offline readiness.')
        }
        ['releaseCompileClasspath', 'releaseRuntimeClasspath'].each { name ->
            def artifacts = configurations.getByName(name).incoming.artifactView {
                componentFilter { id -> id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                attributes {
                    attribute(org.gradle.api.artifacts.type.ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'android-classes-jar')
                }
            }.files
            artifacts.each { artifact ->
                if (!artifact.isFile()) throw new GradleException("Missing artifact: " + artifact)
            }
            println("Verified offline " + name + ": " + artifacts.size() + " artifacts")
        }
    }
}
