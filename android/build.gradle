allprojects {
    repositories {
        // Keep the story editor's verified artifacts available to both compile and runtime.
        // Exclusive versions prevent cached remote repository metadata from
        // sending Gradle back to the network for these locally supplied files.
        exclusiveContent {
            forRepository {
                maven {
                    name = 'sornazStoryOffline'
                    url = uri("$rootDir/offline-maven")
                }
            }
            filter {
                includeVersion('org.jetbrains.kotlinx', 'kotlinx-coroutines-android', '1.9.0')
                includeVersion('org.jetbrains.kotlinx', 'kotlinx-coroutines-guava', '1.9.0')
                includeVersion('androidx.concurrent', 'concurrent-futures', '1.2.0')
                includeVersion('com.antonkarpenko', 'ffmpeg-kit-audio', '2.2.3')
            }
        }
        // Flutter engine artifacts cached locally for reliable/offline builds.
        maven { url = uri("$rootDir/offline-maven") }
        maven { url = uri('https://maven.aliyun.com/repository/google') }
        google()
        mavenCentral()
    }
}

buildscript {
    ext.kotlin_version = '2.1.20'
    repositories {
        maven { url = uri('https://maven.aliyun.com/repository/google') }
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects { project ->
    // The FFmpeg plugin asks for annotation 1.9.1, while the offline cache
    // already contains the newer 1.10.0 artifact and its JVM variant.
    if (project.name == 'ffmpeg_kit_flutter_new_audio') {
        project.configurations.configureEach {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'androidx.annotation' &&
                    details.requested.name == 'annotation' &&
                    details.requested.version == '1.9.1') {
                    details.useVersion('1.10.0')
                    details.because('Use the cached compatible AndroidX annotation release for offline builds')
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
