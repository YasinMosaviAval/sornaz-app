allprojects {
    repositories {
        // Keep the story editor's verified artifacts available to both compile and runtime.
        // Exclusive versions prevent cached remote repository metadata from
        // sending Gradle back to the network for these locally supplied files.
        exclusiveContent {
            forRepository {
                maven {
                    name = 'sornazStoryOffline'
                    url = uri("$rootDir/offline-maven")
                }
            }
            filter {
                includeVersion('org.jetbrains.kotlinx', 'kotlinx-coroutines-android', '1.9.0')
                includeVersion('org.jetbrains.kotlinx', 'kotlinx-coroutines-guava', '1.9.0')
                includeVersion('androidx.concurrent', 'concurrent-futures', '1.2.0')
            }
        }
        // Flutter engine artifacts cached locally for reliable/offline builds.
        maven { url = uri("$rootDir/offline-maven") }
        maven { url = uri('https://maven.aliyun.com/repository/google') }
        google()
        mavenCentral()
    }
}

buildscript {
    ext.kotlin_version = '2.1.20'
    repositories {
        maven { url = uri('https://maven.aliyun.com/repository/google') }
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
